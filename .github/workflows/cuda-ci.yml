name: NVIDIA GPU workflow
on:
  push:
    branches:
      - gpu
  pull_request:
    types:
      - labeled
      - synchronize

jobs:
  tests:
    # if: contains(github.event.pull_request.labels.*.name, 'GPU CI')
    runs-on: [GPU-runner]
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      
      - name: Check GPU is available
        run: nvidia-smi

      - name: Configure CUDA Environment
        run: |
          echo "CUDA_HOME=/usr/local/cuda" >> $GITHUB_ENV
          echo "CUDACXX=/usr/local/cuda/bin/nvcc" >> $GITHUB_ENV
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        env:
          CUDA_HOME: /usr/local/cuda

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-all-dev libopenmpi-dev libnetcdf-dev libhdf5-dev libnetcdf-c++4-dev libgsl-dev pkg-config nvidia-cuda-toolkit

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install netCDF4 cmake ninja pybind11 setuptools wheel 
          export CUDA_BIN_PATH=$(which nvcc)
          echo "Using NVCC at: $CUDA_BIN_PATH"
          pip install -v --no-build-isolation -e ".[dev]"
          pip install coverage
        env:
          CMAKE_ARGS: "-DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc -DCMAKE_CUDA_ARCHITECTURES=75 -DCUDAToolkit_ROOT=/usr/local/cuda"
          NETCDF_DIR: /usr
          HDF5_DIR: /usr
          GSL_DIR: /usr
            
      - name: Run tests
        run: |
          python -m coverage run -m unittest discover tests/
          python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella


