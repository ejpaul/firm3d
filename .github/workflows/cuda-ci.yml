name: NVIDIA GPU workflow
on:
  push:
    branches:
      - gpu
  pull_request:
    types:
      - labeled
      - synchronize

jobs:
  tests:
    # if: contains(github.event.pull_request.labels.*.name, 'GPU CI')
    runs-on: [GPU-runner]
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      
      - name: Check GPU is available
        run: nvidia-smi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-all-dev libopenmpi-dev libnetcdf-dev libhdf5-dev libnetcdf-c++4-dev libgsl-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install netCDF4
          pip install -e ".[dev]"
          pip install coverage
        env:
          CUDA_HOME: /usr/local/cuda
          PATH: /usr/local/cuda/bin:${{ env.PATH }}
          LD_LIBRARY_PATH: /usr/local/cuda/lib64:${{ env.LD_LIBRARY_PATH }}
          NETCDF_DIR: /usr
          HDF5_DIR: /usr
          GSL_DIR: /usr
            
      - name: Run tests
        run: |
          python -m coverage run -m unittest discover tests/
          python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella


