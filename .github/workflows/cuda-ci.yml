name: NVIDIA GPU workflow
on:
  push:
    branches:
      - gpu
  pull_request:
    types:
      - labeled
      - synchronize

jobs:
  tests:
    # if: contains(github.event.pull_request.labels.*.name, 'GPU CI')
    runs-on: [GPU-runner]
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      
      - name: Check GPU is available
        run: nvidia-smi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-all-dev libopenmpi-dev libnetcdf-dev libhdf5-dev libnetcdf-c++4-dev libgsl-dev pkg-config nvidia-cuda-toolkit
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install netCDF4 cmake ninja "pybind11<=2.13.6" setuptools wheel 
          NVCC_PATH=$(which nvcc)          
          echo "Using NVCC at: $NVCC_PATH"

          export CUDACXX=$NVCC_PATH
          pip install -v --no-build-isolation -e ".[dev]" 2>&1 | tee install.log
          pip install coverage
        env:
          NETCDF_DIR: /usr
          HDF5_DIR: /usr
          GSL_DIR: /usr

      - name: Confirm GPU bindings were compiled
        run: |
          if ! grep -q "CUDA found. GPU bindings will be compiled." install.log; then
            echo "::error::GPU bindings were not compiled!"
            exit 1
          fi
        shell: bash
      - name: Run tests
        run: |
          python -m pip list
          python -m coverage run -m unittest discover tests/
          python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Run Examples
        run: |
          cd examples/gpu_boozer_tracing
          python gpu_boozer_tracing.py

